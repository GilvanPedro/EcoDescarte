# O Render informa a porta pela variável PORT.
server.port=${PORT:8080}
spring.main.banner-mode=off
# Não devolve mensagens internas de erro nem stack traces ao cliente.
server.error.include-message=never
server.error.include-stacktrace=never
# Atrás do proxy do Render, o endereço real do cliente vem nos cabeçalhos X-Forwarded-*.
server.forward-headers-strategy=native

# O banco vem de DATABASE_URL (ver config/BancoDeDados). Sem ela, sobe um H2 em memória.
# As tabelas são criadas pelo Flyway; o Hibernate só confere se batem com as entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# A Neon gratuita suspende o banco quando fica ocioso e tem poucas conexões: pool pequeno.
spring.datasource.hikari.maximum-pool-size=5

# Endereços do site que podem chamar a API (separados por vírgula). Em produção, a URL da Vercel.
app.cors.origens=${CORS_ORIGENS:*}
